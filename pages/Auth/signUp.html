<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/sign.css">
    <title>Sign Up | French Restaurant</title>
</head>

<body>
    <div class="form_body">
        <h1>Register Form</h1>
        <form action="../Home/home_page.html">
            <table>
                <tr>
                    <td><label>Name:</label></td>
                    <td>
                        <input type="text" name="name" placeholder="Enter Your Name" maxlength="100" required>
                    </td>
                </tr>
                <tr>
                    <td><label>Email:</label></td>
                    <td>
                        <input type="email" name="email" placeholder="Enter Your Email" maxlength="100" required>
                    </td>
                </tr>
                <tr>
                    <td><label>Password:</label></td>
                    <td>
                        <input type="password" name="password" placeholder="Enter Your Password" required>
                    </td>
                </tr>
            </table>
            <br>
            <button type="submit">Sign Up</button>
            <button type="button" onclick="window.location.href='login.html'">Login</button>
        </form>
    </div>
</body>

</html>
