<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/forget.css">
    <title>Reset Password | French Restaurant</title>
</head>

<body>
    <div class="form_body">
        <h1>Password Reset</h1>
        <p class="subtitle">Enter your email and we'll send you a reset link</p>

        <form action="login.html">
            <table>
                <tr>
                    <td><label>Email:</label></td>
                    <td>
                        <input type="email" name="email" placeholder="Enter Your Email" maxlength="100" required>
                    </td>
                </tr>
            </table>
            <br>
            <button type="submit">Send Reset Link</button>
            <button type="button" onclick="window.location.href='login.html'">Back to Login</button>
        </form>
    </div>
</body>

</html>
