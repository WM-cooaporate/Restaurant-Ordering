<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../css/login.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="form_body">
        <h1>Login Form</h1>
        <form action="../Home/home_page.html">
            <table>
                <tr>
                    <td>
                        <label>Email:</label>
                    </td>
                    <td>
                        <input type="email " placeholder="Enter Your email " maxlength="100 " required>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label>Password:</label>
                    </td>
                    <td> <input type="password" placeholder="Enter Your Password " required>
                    </td>
                </tr>
            </table>
            <br>
            <button type="submit">Login</button>
            <button onclick="window.location.href='signUp.html' ">SignUp</button>
            <button onclick="window.location.href='forgetPassword.html' ">Forget Password</button>
        </form>
    </div>

</body>

</html>
